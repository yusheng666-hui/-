name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Patch @react-native-voice/voice to remove support library
        working-directory: src
        run: |
          sed -i 's/com\.android\.support:appcompat-v7:[^"]*/androidx.appcompat:appcompat:1.6.1/' node_modules/@react-native-voice/voice/android/build.gradle
          grep appcompat node_modules/@react-native-voice/voice/android/build.gradle

      - name: Expo prebuild
        working-directory: src
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: src/android
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log
          exit $?

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: src/build.log
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yusheng-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
