name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Build APK with Expo
        working-directory: src
        continue-on-error: true
        run: |
          npx expo run:android --no-install --variant debug 2>&1 | tee build.log
          RC=$?
          echo "BUILD_EXIT=$RC" >> $GITHUB_ENV
          exit $RC

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: src/build.log
          if-no-files-found: warn

      - name: Locate APK
        if: always()
        working-directory: src
        run: |
          find . -name '*.apk' -type f 2>/dev/null || echo 'no apk found'
          find . -path '*/build/outputs/apk/*' -type d 2>/dev/null || echo 'no build output dir'

      - name: Upload APK (if built)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yusheng-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn