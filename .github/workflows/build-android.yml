name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Patch @react-native-voice/voice to use AndroidX
        working-directory: src
        run: sed -i 's/com\.android\.support:appcompat-v7:[^"]*/androidx.appcompat:appcompat:1.6.1/' node_modules/@react-native-voice/voice/android/build.gradle

      - name: Expo prebuild
        working-directory: src
        run: npx expo prebuild --platform android --no-install

      - name: Fix AndroidManifest.xml
        working-directory: src
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q 'android:appComponentFactory' "$MANIFEST"; then
            echo "appComponentFactory already present, skipping"
          else
            sed -i 's|<application |<application android:appComponentFactory="androidx.core.app.CoreComponentFactory" tools:replace="android:appComponentFactory" |' "$MANIFEST"
            echo "Added appComponentFactory to manifest"
          fi

      - name: Bundle JS for Android
        working-directory: src
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build debug APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yusheng-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
